<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="utf-8"/>
<style>
/*
   Claude Desktop palette. Mirrored from Themes/ClaudeTheme.*.xaml — the host
   overwrites these at runtime via setThemeColors() so the transcript matches
   the WPF chrome exactly. The values here are the fallback for a host that
   never pushes a palette (and for eyeballing the file standalone).
*/
:root {
    --bg: #262624;
    --surface: #2F2E2B;
    --surface-subtle: #35342F;
    --text: #E8E6E3;
    --muted: #A5A399;
    --faint: #7C7A72;
    --border: #3E3D39;
    --border-strong: #4E4C46;
    --accent: #D97757;
    --accent-hover: #E08A6C;
    --accent-fg: #1F1E1D;
    --accent-subtle: #3A2E29;
    --success: #6BAE6E;
    --error: #D98A8A;
    --selection: #43413A;
    --code-bg: #1F1E1D;

    /* Segoe UI Variable Text first: it carries proper optical sizing at body
       scale, where plain Segoe UI looks noticeably coarser. */
    --font-sans: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-mono: 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace;

    /* One vertical rhythm, so nothing is spaced by eye. */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 18px;
    --space-5: 26px;

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 18px;

    /* Negative tracking at body size; sans faces are cut a touch loose for
       screen reading at 14–15px. */
    --tracking-body: -0.003em;
    --tracking-tight: -0.012em;
}

:root[data-theme="light"] {
    --bg: #FAF9F5;
    --surface: #FFFFFF;
    --surface-subtle: #F0EEE6;
    --text: #3D3D3A;
    --muted: #6E6E68;
    --faint: #8F8F87;
    --border: #E5E3DA;
    --border-strong: #D4D1C7;
    --accent: #D97757;
    --accent-hover: #C2624A;
    --accent-fg: #FFFFFF;
    --accent-subtle: #F7EDE8;
    --success: #3E7A41;
    --error: #A94848;
    --selection: #E3DDD0;
    --code-bg: #F5F4EF;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14.5px;
    /* Loose enough that dense prose doesn't set as a wall of text. */
    line-height: 1.68;
    letter-spacing: var(--tracking-body);
    height: 100%;
    word-wrap: break-word;
    overflow-wrap: break-word;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-variant-ligatures: contextual;
    /* Tabular figures keep counts and token totals from shifting as they change. */
    font-variant-numeric: tabular-nums;
}

::selection { background: var(--selection); }

#chat-container {
    overflow-y: auto;
    overflow-x: hidden;
    height: 100%;
    padding: var(--space-5) 0 32px;
    scroll-behavior: smooth;
}

/* Left-anchored content column. Capped for line-length readability, but NOT
   centred: a centred column in a wide docked panel leaves the conversation
   floating in the middle of an empty pane with the eye starting nowhere near
   the left edge. Anchoring left keeps the text where a terminal or an editor
   puts it, and the cap still stops long lines running edge to edge. */
.msg {
    position: relative;
    max-width: 860px;
    margin: 0;
    padding: 0 24px var(--space-4);
}

/* Thin and low-contrast: the scrollbar is orientation, not chrome. */
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border-radius: 6px;
    border: 3.5px solid var(--bg);
    background-clip: padding-box;
    transition: background 0.15s ease;
}
::-webkit-scrollbar-thumb:hover { background: var(--muted); }
::-webkit-scrollbar-corner { background: transparent; }

/* ── User turn ──────────────────────────────────────────────────────────
   Right-aligned rounded bubble, capped so a long paste doesn't span the
   full column and lose its "said by me" reading. */
.msg-user { display: flex; justify-content: flex-end; }
.msg-user .bubble {
    background: var(--surface-subtle);
    /* No border: the fill alone separates it, and an outline at this size
       reads as a control rather than something someone said. */
    border: none;
    border-radius: var(--radius-lg);
    padding: 9px 15px;
    max-width: 82%;
    line-height: 1.6;
}
.msg-user .md-content > *:first-child { margin-top: 0; }
.msg-user .md-content > *:last-child { margin-bottom: 0; }

/* ── Assistant turn ─────────────────────────────────────────────────────
   No bubble, no avatar column — plain prose, the way the desktop app reads. */
.msg-assistant .md-content { max-width: 100%; }

.streaming-cursor::after {
    content: '';
    display: inline-block;
    width: 7px;
    height: 15px;
    margin-left: 2px;
    vertical-align: text-bottom;
    background: var(--accent);
    border-radius: 1px;
    animation: blink 1.1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ── Tool run group ─────────────────────────────────────────────────────
   Consecutive tool steps collapse behind one muted line ("Used 9 tools"),
   because a long run of individual cards drowns out the actual conversation.
   The cards are still there, one click away. */
.tool-group {
    max-width: 860px;
    margin: 0;
    padding: 0 24px var(--space-4);
}
.tool-group-header {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    user-select: none;
    color: var(--faint);
    font-size: 13px;
    padding: 2px 0;
    transition: color 0.12s ease;
}
.tool-group-header:hover { color: var(--muted); }
.tool-group-chevron {
    font-size: 9px;
    transition: transform 0.15s ease;
}
.tool-group-chevron.expanded { transform: rotate(90deg); }
.tool-group-header .running { color: var(--accent); }
.tool-group-header .failed { color: var(--error); }

.tool-group-body { display: none; margin-top: 8px; }
.tool-group-body.visible { display: block; }
/* Cards inside a group must not re-apply the column padding. */
.tool-group-body .msg { max-width: none; padding: 0 0 8px; }
.tool-group-body .msg:last-child { padding-bottom: 0; }

/* ── Tool call ──────────────────────────────────────────────────────────
   A collapsed card by default: status dot, tool name, dim argument. Clicking
   the header reveals the result. This is the one place that departs from a
   pure chat UI — a coding assistant emits tool output a chat app has no
   equivalent for. */
.msg-toolstep .tool-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    /* A hairline lift rather than a drop shadow — enough to separate the card
       from the page without it appearing to float above the conversation. */
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
}
.tool-header {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 13px;
    cursor: pointer;
    user-select: none;
    font-size: 13px;
    transition: background 0.12s ease;
}
.tool-header:hover { background: var(--surface-subtle); }
.tool-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--muted);
}
.tool-dot.Pending {
    background: var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
}
.tool-dot.Success { background: var(--success); }
.tool-dot.Error { background: var(--error); }
@keyframes pulse { 50% { opacity: 0.3; } }

.tool-name {
    font-weight: 600;
    color: var(--text);
    flex-shrink: 0;
}
.tool-args {
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    flex: 1;
}
.tool-chevron {
    color: var(--faint);
    font-size: 10px;
    flex-shrink: 0;
    transition: transform 0.15s ease;
}
.tool-chevron.expanded { transform: rotate(90deg); }

.tool-body {
    display: none;
    border-top: 1px solid var(--border);
    padding: 11px 13px;
    font-size: 12.5px;
    color: var(--muted);
    max-height: 420px;
    overflow: auto;
}
.tool-body.visible { display: block; }
.tool-body pre, .tool-body code { font-size: 12px; }
.tool-body > *:first-child { margin-top: 0; }
.tool-body > *:last-child { margin-bottom: 0; }

/* Streaming sub-agent / tool output, shown inline while Pending. */
.tool-stream {
    display: none;
    border-top: 1px solid var(--border);
    padding: 11px 13px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    white-space: pre-wrap;
    max-height: 260px;
    overflow: auto;
}
.tool-stream.visible { display: block; }

/* ── Thinking ───────────────────────────────────────────────────────────
   Deliberately quiet: it's ambient, not content. */
.msg-thinking .think-header {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    user-select: none;
    color: var(--faint);
    font-size: 13px;
    font-style: italic;
    padding: 3px 0;
}
.msg-thinking .think-header:hover { color: var(--muted); }
.think-spark { font-style: normal; color: var(--accent); font-size: 11px; }
.think-chevron { font-size: 9px; transition: transform 0.15s ease; }
.think-chevron.expanded { transform: rotate(90deg); }

.think-body {
    display: none;
    margin-top: 8px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 2px solid var(--accent);
    border-radius: var(--radius-md);
    color: var(--muted);
    font-size: 13px;
    white-space: pre-wrap;
    max-height: 340px;
    overflow: auto;
}
.think-body.visible { display: block; }

/* ── Todo list (TodoWrite) ──────────────────────────────────────────────── */
.todo-list { list-style: none; margin: 0; padding: 0; }
.todo-item {
    display: flex;
    align-items: baseline;
    gap: 9px;
    padding: 3px 0;
    font-size: 13px;
}
.todo-box { flex-shrink: 0; font-size: 12px; }
.todo-item.completed { color: var(--faint); }
.todo-item.completed .todo-text { text-decoration: line-through; }
.todo-item.completed .todo-box { color: var(--success); }
.todo-item.in_progress { color: var(--text); font-weight: 600; }
.todo-item.in_progress .todo-box { color: var(--accent); }
.todo-item.pending { color: var(--muted); }
.todo-item.pending .todo-box { color: var(--faint); }

/* ── Diff ───────────────────────────────────────────────────────────────── */
.diff {
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.55;
    border-radius: var(--radius-sm);
    overflow: hidden;
    border: 1px solid var(--border);
}
.diff-row { display: flex; white-space: pre; }
.diff-gutter {
    flex-shrink: 0;
    width: 46px;
    text-align: right;
    padding: 0 9px 0 0;
    color: var(--faint);
    user-select: none;
}
.diff-mark { flex-shrink: 0; width: 16px; text-align: center; user-select: none; }
.diff-text { flex: 1; padding-right: 10px; overflow-x: auto; }
.diff-row.add { background: rgba(107, 174, 110, 0.16); }
.diff-row.add .diff-mark { color: var(--success); }
.diff-row.del { background: rgba(217, 138, 138, 0.16); }
.diff-row.del .diff-mark { color: var(--error); }
.diff-row.ctx { color: var(--muted); }

/* ── Show more ──────────────────────────────────────────────────────────── */
.show-more {
    display: inline-block;
    margin-top: 7px;
    color: var(--accent);
    font-size: 12px;
    cursor: pointer;
    user-select: none;
}
.show-more:hover { text-decoration: underline; }

/* ── Copy button ────────────────────────────────────────────────────────── */
.msg-copy-btn {
    position: absolute;
    top: -2px;
    right: 18px;
    width: 26px;
    height: 26px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--faint);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    z-index: 10;
    padding: 0;
}
.msg:hover .msg-copy-btn { opacity: 1; }
.msg-copy-btn:hover { color: var(--text); background: var(--surface-subtle); }
.msg-copy-btn.copied { color: var(--success); opacity: 1; }

/* ── Context menu ───────────────────────────────────────────────────────── */
.ctx-menu {
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 5px;
    min-width: 130px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.28);
    z-index: 1000;
    display: none;
}
.ctx-menu-item {
    padding: 6px 11px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
    user-select: none;
}
.ctx-menu-item:hover { background: var(--accent); color: var(--accent-fg); }

/* ── Markdown ───────────────────────────────────────────────────────────── */
.md-content { min-width: 0; }

/* Headings are set tight and only modestly larger. In a chat panel a big
   display scale fights the conversation instead of organising it. */
.md-content h1 { font-size: 1.28em; font-weight: 650; letter-spacing: var(--tracking-tight); margin: 1.15em 0 0.4em; line-height: 1.3; }
.md-content h2 { font-size: 1.14em; font-weight: 650; letter-spacing: var(--tracking-tight); margin: 1.05em 0 0.38em; line-height: 1.35; }
.md-content h3 { font-size: 1.04em; font-weight: 650; letter-spacing: var(--tracking-tight); margin: 0.95em 0 0.34em; line-height: 1.4; }
.md-content h4, .md-content h5, .md-content h6 { font-size: 1em; font-weight: 650; margin: 0.85em 0 0.3em; }
.md-content > h1:first-child, .md-content > h2:first-child, .md-content > h3:first-child { margin-top: 0; }

.md-content p { margin: 0.7em 0; }
.md-content a { color: var(--accent); text-decoration: none; }
.md-content a:hover { text-decoration: underline; text-underline-offset: 2px; }
.md-content a.file-link { cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.md-content strong { font-weight: 650; }

.md-content code {
    background: var(--surface-subtle);
    /* Borderless: at inline scale a 1px outline muddies the glyphs. The tint
       is enough to mark it as code. */
    border: none;
    padding: 1.5px 5px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 0.855em;
    font-variant-ligatures: none;
}
.md-content pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    margin: 0.9em 0;
    overflow-x: auto;
}
.md-content pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 12.5px;
    line-height: 1.62;
    letter-spacing: 0;
    color: var(--text);
}
.md-content blockquote {
    border-left: 2px solid var(--border-strong);
    margin: 0.9em 0;
    padding: 0.15em 0 0.15em 15px;
    color: var(--muted);
}
.md-content ul, .md-content ol { margin: 0.7em 0; padding-left: 1.45em; }
.md-content li { margin: 0.3em 0; padding-left: 0.15em; }
.md-content li::marker { color: var(--faint); }
/* Nested lists sit closer — the indent already signals the level. */
.md-content li > ul, .md-content li > ol { margin: 0.3em 0; }

.md-content table {
    border-collapse: collapse;
    margin: 0.95em 0;
    width: 100%;
    font-size: 13.5px;
    /* Horizontal rules only. Full gridlines turn a small table into a form. */
    border: none;
}
.md-content th, .md-content td {
    border-bottom: 1px solid var(--border);
    padding: 8px 12px 8px 0;
    text-align: left;
}
.md-content th {
    background: none;
    font-weight: 650;
    font-size: 12.5px;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom-color: var(--border-strong);
}
.md-content tr:last-child td { border-bottom: none; }

.md-content hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }
.md-content img { max-width: 100%; border-radius: var(--radius-sm); }
.md-content > *:first-child { margin-top: 0; }
.md-content > *:last-child { margin-bottom: 0; }
</style>
<script>{{SHOWDOWN_JS}}</script>
<script>
var converter = new showdown.Converter({
    tables: true,
    tasklists: true,
    strikethrough: true,
    ghCodeBlocks: true,
    simplifiedAutoLink: true,
    literalMidWordUnderscores: true,
    openLinksInNewWindow: true
});

// User-typed messages: preserve single newlines as <br> so multi-line
// chat input renders the way the user typed it.
var userConverter = new showdown.Converter({
    tables: true,
    tasklists: true,
    strikethrough: true,
    ghCodeBlocks: true,
    simplifiedAutoLink: true,
    literalMidWordUnderscores: true,
    openLinksInNewWindow: true,
    simpleLineBreaks: true
});

var _userScrolledUp = false;
var _container;

// The tool-run group currently accepting steps, or null when the last thing
// appended was not a tool step. Reset by any non-tool message so a group only
// ever spans a genuinely consecutive run.
var _currentGroup = null;

var CHEVRON = '▶';

// File path regex: require the extension to start lowercase, which keeps
// identifiers like RTR.MobileApp from being linkified as paths.
var filePathRe = /(?:[A-Za-z]:[\\\/]|\.{0,2}\/|(?=[\w@]))(?:[\w\-\.@]+[\\\/])+[\w\-\.]+\.[a-z][a-zA-Z0-9]{0,9}(?::(\d+)(?:-\d+)?)?/g;

function linkifyFilePaths(container) {
    var codes = container.querySelectorAll('code');
    for (var i = 0; i < codes.length; i++) {
        var code = codes[i];
        if (code.closest('pre')) continue;
        if (code.querySelector('a')) continue;
        var text = code.textContent;
        filePathRe.lastIndex = 0;
        if (filePathRe.test(text) && text.match(filePathRe).length === 1 && text.trim() === text.match(filePathRe)[0]) {
            var match = text.match(filePathRe)[0];
            var a = document.createElement('a');
            a.href = '#';
            a.className = 'file-link';
            a.dataset.path = match;
            a.textContent = text;
            a.title = 'Open in editor';
            code.textContent = '';
            code.appendChild(a);
        }
    }
    var links = container.querySelectorAll('a[href]');
    for (var j = 0; j < links.length; j++) {
        var link = links[j];
        if (link.classList.contains('file-link')) continue;
        var href = link.getAttribute('href');
        if (!href) continue;
        if (/^(https?|mailto|ftp|javascript):/i.test(href)) continue;
        link.classList.add('file-link');
        link.dataset.path = href;
        link.title = 'Open in editor';
        link.href = '#';
    }

    var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
    var textNodes = [];
    while (walker.nextNode()) textNodes.push(walker.currentNode);
    for (var k = 0; k < textNodes.length; k++) {
        var node = textNodes[k];
        if (node.parentNode.closest('pre, code, a')) continue;
        var txt = node.nodeValue;
        filePathRe.lastIndex = 0;
        if (!filePathRe.test(txt)) continue;
        filePathRe.lastIndex = 0;
        var frag = document.createDocumentFragment();
        var lastIdx = 0;
        var m;
        while ((m = filePathRe.exec(txt)) !== null) {
            if (m.index > lastIdx)
                frag.appendChild(document.createTextNode(txt.slice(lastIdx, m.index)));
            var a2 = document.createElement('a');
            a2.href = '#';
            a2.className = 'file-link';
            a2.dataset.path = m[0];
            a2.textContent = m[0];
            a2.title = 'Open in editor';
            frag.appendChild(a2);
            lastIdx = filePathRe.lastIndex;
        }
        if (lastIdx < txt.length)
            frag.appendChild(document.createTextNode(txt.slice(lastIdx)));
        node.parentNode.replaceChild(frag, node);
    }
}

function renderMd(text) { return text ? converter.makeHtml(text) : ''; }
function renderUserMd(text) { return text ? userConverter.makeHtml(text) : ''; }

function isNearBottom() {
    if (!_container) return true;
    return _container.scrollHeight - _container.scrollTop - _container.clientHeight < 60;
}
function scrollToBottom() { if (_container) _container.scrollTop = _container.scrollHeight; }
function maybeScrollToBottom() { if (!_userScrolledUp) scrollToBottom(); }

// ── Specialised body renderers ──────────────────────────────────────────

/**
 * TodoWrite bodies arrive as markdown checkboxes ("- [x] done"). Rendering
 * them through showdown gives real checkbox inputs, which read as a form.
 * Parse them into a styled list instead.
 * Returns null when the text isn't a todo list, so callers fall through.
 */
function tryRenderTodos(text) {
    if (!text) return null;
    var lines = text.split('\n').filter(function (l) { return l.trim().length > 0; });
    if (!lines.length) return null;

    var items = [];
    for (var i = 0; i < lines.length; i++) {
        var m = /^\s*-\s*\[([ x~])\]\s*(.*)$/.exec(lines[i]);
        if (!m) return null;
        items.push({
            status: m[1] === 'x' ? 'completed' : (m[1] === '~' ? 'in_progress' : 'pending'),
            text: m[2]
        });
    }

    var ul = document.createElement('ul');
    ul.className = 'todo-list';
    for (var j = 0; j < items.length; j++) {
        var li = document.createElement('li');
        li.className = 'todo-item ' + items[j].status;
        var box = document.createElement('span');
        box.className = 'todo-box';
        box.textContent = items[j].status === 'completed' ? '☑'
                        : items[j].status === 'in_progress' ? '◐'
                        : '☐';
        var span = document.createElement('span');
        span.className = 'todo-text';
        span.textContent = items[j].text;
        li.appendChild(box);
        li.appendChild(span);
        ul.appendChild(li);
    }
    return ul;
}

/**
 * Renders a unified diff (the shape Edit/Write tool results use) with gutter
 * line numbers and tinted +/- rows. Returns null when the text has no diff
 * markers, so ordinary tool output falls through to markdown.
 */
function tryRenderDiff(text) {
    if (!text) return null;
    var lines = text.split('\n');
    var marked = 0;
    for (var i = 0; i < lines.length; i++) {
        if (/^[+-](?![+-])/.test(lines[i])) marked++;
    }
    // Require a couple of real +/- lines; one stray "-" is a bullet, not a diff.
    if (marked < 2) return null;

    var wrap = document.createElement('div');
    wrap.className = 'diff';
    var lineNo = 0;
    for (var j = 0; j < lines.length; j++) {
        var line = lines[j];
        if (/^(diff |index |---|\+\+\+|@@)/.test(line)) continue;

        var kind = line.charAt(0) === '+' ? 'add' : (line.charAt(0) === '-' ? 'del' : 'ctx');
        var body = (kind === 'ctx') ? line : line.slice(1);
        if (kind !== 'del') lineNo++;

        var row = document.createElement('div');
        row.className = 'diff-row ' + kind;

        var gutter = document.createElement('span');
        gutter.className = 'diff-gutter';
        gutter.textContent = kind === 'del' ? '' : String(lineNo);

        var mark = document.createElement('span');
        mark.className = 'diff-mark';
        mark.textContent = kind === 'add' ? '+' : (kind === 'del' ? '−' : '');

        var txt = document.createElement('span');
        txt.className = 'diff-text';
        txt.textContent = body;

        row.appendChild(gutter);
        row.appendChild(mark);
        row.appendChild(txt);
        wrap.appendChild(row);
    }
    return wrap;
}

/** Opens a new tool-run group, or returns the one still accepting steps. */
function ensureToolGroup() {
    if (_currentGroup) return _currentGroup;

    var group = document.createElement('div');
    group.className = 'tool-group';

    var header = document.createElement('div');
    header.className = 'tool-group-header';

    var chevron = document.createElement('span');
    chevron.className = 'tool-group-chevron';
    chevron.textContent = CHEVRON;

    var label = document.createElement('span');
    label.className = 'tool-group-label';

    header.appendChild(chevron);
    header.appendChild(label);

    var body = document.createElement('div');
    body.className = 'tool-group-body';

    header.addEventListener('click', function () {
        var show = !body.classList.contains('visible');
        body.classList.toggle('visible', show);
        chevron.classList.toggle('expanded', show);
    });

    group.appendChild(header);
    group.appendChild(body);
    _container.appendChild(group);
    _currentGroup = group;
    return group;
}

/**
 * Rewrites a group's summary line from the state of the steps inside it.
 * Called whenever a step is added or changes status, since the label depends
 * on the whole run rather than any one step.
 */
function updateGroupHeader(group) {
    if (!group) return;
    var label = group.querySelector('.tool-group-label');
    if (!label) return;

    var steps = group.querySelectorAll('.msg-toolstep');
    var n = steps.length;
    if (!n) return;

    var pending = 0, failed = 0, allBash = true;
    for (var i = 0; i < n; i++) {
        var dot = steps[i].querySelector('.tool-dot');
        if (dot) {
            if (dot.classList.contains('Pending')) pending++;
            if (dot.classList.contains('Error')) failed++;
        }
        if (steps[i].dataset.tool !== 'Bash') allBash = false;
    }

    label.className = 'tool-group-label';
    var text;

    if (pending > 0) {
        // Name what's actually happening now — "Running a command" reads far
        // better mid-run than a count that keeps changing under the cursor.
        var current = steps[n - 1].dataset.tool || '';
        text = allBash ? 'Running a command' : (current ? 'Running ' + current : 'Working');
        label.classList.add('running');
    } else if (allBash) {
        text = n === 1 ? 'Ran 1 command' : 'Ran ' + n + ' commands';
    } else {
        text = n === 1 ? 'Used 1 tool' : 'Used ' + n + ' tools';
    }

    if (failed > 0) {
        text += ' · ' + failed + ' failed';
        label.classList.add('failed');
    }

    label.textContent = text;
}

/** Finds the group a message belongs to, if any. */
function groupOf(el) {
    return el && el.parentNode ? el.parentNode.closest('.tool-group') : null;
}

/** Shortens a tool argument to something that fits one header line. */
function shortArgs(toolName, raw) {
    if (!raw) return '';
    var s = String(raw).replace(/\s+/g, ' ').trim();
    // FormatToolInput wraps commands in a fence and paths in backticks.
    s = s.replace(/^```\s*/, '').replace(/\s*```$/, '').replace(/^`+|`+$/g, '');
    return s.length > 90 ? s.slice(0, 89) + '…' : s;
}

// ── Public API ──────────────────────────────────────────────────────────

function addMessage(id, type, dataJson) {
    var data = typeof dataJson === 'string' ? JSON.parse(dataJson) : dataJson;
    var div = document.createElement('div');
    div.id = 'msg-' + id;
    div.className = 'msg';
    div.dataset.type = type;

    if (type === 'User') {
        div.classList.add('msg-user');
        var bubble = document.createElement('div');
        bubble.className = 'bubble';
        var uc = document.createElement('div');
        uc.className = 'md-content msg-content';
        uc.innerHTML = renderUserMd(data.Content || '');
        linkifyFilePaths(uc);
        bubble.appendChild(uc);
        div.appendChild(bubble);
    }
    else if (type === 'Assistant') {
        div.classList.add('msg-assistant');
        var ac = document.createElement('div');
        ac.className = 'md-content msg-content';
        if (data.IsStreaming) ac.classList.add('streaming-cursor');
        ac.innerHTML = renderMd(data.Content || '');
        linkifyFilePaths(ac);
        div.appendChild(ac);
    }
    else if (type === 'ToolStep') {
        div.classList.add('msg-toolstep');
        // Read back by updateGroupHeader to label the run.
        div.dataset.tool = data.ToolName || '';
        var card = document.createElement('div');
        card.className = 'tool-card';

        var header = document.createElement('div');
        header.className = 'tool-header';

        var chevron = document.createElement('span');
        chevron.className = 'tool-chevron';
        chevron.textContent = CHEVRON;

        var dot = document.createElement('span');
        dot.className = 'tool-dot msg-status ' + (data.Status || 'Pending');

        var name = document.createElement('span');
        name.className = 'tool-name';
        name.textContent = data.ToolName || 'Tool';

        var args = document.createElement('span');
        args.className = 'tool-args msg-args';
        args.textContent = shortArgs(data.ToolName, data.ToolArgs || '');

        header.appendChild(chevron);
        header.appendChild(dot);
        header.appendChild(name);
        header.appendChild(args);
        header.addEventListener('click', function () {
            // Prefer the completed body; fall back to the streaming pane while
            // the tool is still running.
            var b = card.querySelector('.tool-body');
            var s = card.querySelector('.tool-stream');
            var target = (b && b.dataset.filled === '1') ? b : s;
            if (!target) return;
            var show = !target.classList.contains('visible');
            target.classList.toggle('visible', show);
            chevron.classList.toggle('expanded', show);
        });
        card.appendChild(header);

        var stream = document.createElement('div');
        stream.className = 'tool-stream msg-streaming-content';
        stream.textContent = data.Content || '';
        card.appendChild(stream);

        var body = document.createElement('div');
        body.className = 'md-content tool-body msg-body';
        card.appendChild(body);

        div.appendChild(card);
    }
    else if (type === 'Thinking') {
        div.classList.add('msg-thinking');
        var th = document.createElement('div');
        th.className = 'think-header';

        var tchev = document.createElement('span');
        tchev.className = 'think-chevron';
        tchev.textContent = CHEVRON;

        var spark = document.createElement('span');
        spark.className = 'think-spark';
        spark.textContent = '✻';

        var title = document.createElement('span');
        title.className = 'msg-expander-title';
        title.textContent = data.ExpanderTitle || 'Thinking…';

        th.appendChild(tchev);
        th.appendChild(spark);
        th.appendChild(title);

        var tbody = document.createElement('div');
        tbody.className = 'think-body msg-streaming-content';
        tbody.textContent = data.Content || '';

        th.addEventListener('click', function () {
            var show = !tbody.classList.contains('visible');
            tbody.classList.toggle('visible', show);
            tchev.classList.toggle('expanded', show);
        });

        div.appendChild(th);
        div.appendChild(tbody);
    }

    if (type === 'ToolStep') {
        var group = ensureToolGroup();
        group.querySelector('.tool-group-body').appendChild(div);
        updateGroupHeader(group);
    } else {
        // Anything that isn't a tool step ends the run.
        _currentGroup = null;
        _container.appendChild(div);
    }

    maybeScrollToBottom();
}

var _rafPending = {};
function updateContent(id, contentMarkdown) {
    if (_rafPending[id]) return;
    _rafPending[id] = requestAnimationFrame(function () {
        delete _rafPending[id];
        var el = document.getElementById('msg-' + id);
        if (!el) return;
        var type = el.dataset.type;

        if (type === 'User' || type === 'Assistant') {
            var mc = el.querySelector('.msg-content');
            if (mc) {
                mc.innerHTML = type === 'User' ? renderUserMd(contentMarkdown) : renderMd(contentMarkdown);
                linkifyFilePaths(mc);
            }
        } else if (type === 'ToolStep' || type === 'Thinking') {
            var sc = el.querySelector('.msg-streaming-content');
            if (sc) sc.textContent = contentMarkdown;
        }
        maybeScrollToBottom();
    });
}

function updateStatus(id, status, expanderTitle) {
    var el = document.getElementById('msg-' + id);
    if (!el) return;

    var dot = el.querySelector('.tool-dot');
    if (dot) {
        dot.className = 'tool-dot msg-status ' + status;
        // The group label reflects pending/failed counts across the whole run.
        updateGroupHeader(groupOf(el));
    }

    if (expanderTitle) {
        var et = el.querySelector('.msg-expander-title');
        if (et) et.textContent = expanderTitle;
    }
}

function setBody(id, bodyContent, bodyMode) {
    var el = document.getElementById('msg-' + id);
    if (!el) return;
    var body = el.querySelector('.msg-body');
    if (!body) return;
    if (!bodyContent) return;

    body.innerHTML = '';
    var special = tryRenderTodos(bodyContent) || tryRenderDiff(bodyContent);
    if (special) {
        body.appendChild(special);
    } else if (bodyMode === 'Html') {
        body.innerHTML = bodyContent;
        linkifyFilePaths(body);
    } else {
        body.innerHTML = renderMd(bodyContent);
        linkifyFilePaths(body);
    }
    body.dataset.filled = '1';

    // A todo list is the point of the step, not an aside — show it expanded,
    // and open the enclosing run too, or it would sit expanded inside a
    // collapsed group where nobody can see it.
    if (special && special.classList.contains('todo-list')) {
        body.classList.add('visible');
        var chev = el.querySelector('.tool-chevron');
        if (chev) chev.classList.add('expanded');

        var group = groupOf(el);
        if (group) {
            var gBody = group.querySelector('.tool-group-body');
            var gChev = group.querySelector('.tool-group-chevron');
            if (gBody) gBody.classList.add('visible');
            if (gChev) gChev.classList.add('expanded');
        }
    }

    maybeScrollToBottom();
}

function completeMessage(id) {
    var el = document.getElementById('msg-' + id);
    if (!el) return;

    var mc = el.querySelector('.msg-content');
    if (mc) mc.classList.remove('streaming-cursor');

    // Collapse the live stream pane; the body carries the result from here.
    var stream = el.querySelector('.tool-stream');
    if (stream) stream.classList.remove('visible');

    // "Running X" becomes "Used N tools" once nothing is pending.
    updateGroupHeader(groupOf(el));
}

function clearAll() {
    if (_container) _container.innerHTML = '';
    _currentGroup = null;
    _userScrolledUp = false;
}

function loadMessages(jsonArray) {
    // Restoring replays through addMessage, so grouping rebuilds itself — but
    // only if no half-open group is carried over from a previous transcript.
    _currentGroup = null;

    var messages = typeof jsonArray === 'string' ? JSON.parse(jsonArray) : jsonArray;
    for (var i = 0; i < messages.length; i++) {
        var m = messages[i];
        addMessage(m.Id, m.Type, m);
        if (m.Body) setBody(m.Id, m.Body, m.BodyMode || 'Markdown');
        if (!m.IsStreaming) completeMessage(m.Id);
    }
    scrollToBottom();
}

/** Switches the palette wholesale. Called by the host on theme change. */
function setTheme(variant) {
    var light = (variant === 'Light' || variant === 'light');
    document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
}

function setThemeColors(colorsJson) {
    var colors = typeof colorsJson === 'string' ? JSON.parse(colorsJson) : colorsJson;
    var root = document.documentElement;
    for (var key in colors) {
        if (colors.hasOwnProperty(key)) root.style.setProperty(key, colors[key]);
    }
}

// ── Events ──────────────────────────────────────────────────────────────

document.addEventListener('click', function (e) {
    var link = e.target.closest('a.file-link');
    if (link) {
        e.preventDefault();
        var path = link.dataset.path;
        if (path) window.chrome.webview.postMessage(JSON.stringify({ type: 'openFile', path: path }));
    }
});

var ICON_COPY = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M3.5 10.5h-1a1.5 1.5 0 01-1.5-1.5v-6a1.5 1.5 0 011.5-1.5h6a1.5 1.5 0 011.5 1.5v1"/></svg>';
var ICON_CHECK = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3.5 8.5 6.5 11.5 12.5 4.5"/></svg>';

function getMessageText(msgEl) {
    var type = msgEl.dataset.type;
    if (type === 'User' || type === 'Assistant') {
        var mc = msgEl.querySelector('.msg-content');
        return mc ? mc.innerText : '';
    } else if (type === 'ToolStep') {
        var name = msgEl.querySelector('.tool-name');
        var args = msgEl.querySelector('.tool-args');
        var body = msgEl.querySelector('.msg-body');
        var stream = msgEl.querySelector('.msg-streaming-content');
        var parts = [];
        if (name) parts.push(name.textContent + (args && args.textContent ? '(' + args.textContent + ')' : ''));
        if (body && body.dataset.filled === '1') parts.push(body.innerText);
        else if (stream) parts.push(stream.textContent);
        return parts.join('\n');
    } else if (type === 'Thinking') {
        var tc = msgEl.querySelector('.think-body');
        return tc ? tc.textContent : '';
    }
    return '';
}

function copyToClipboard(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
}

function addCopyButton(msgDiv) {
    var btn = document.createElement('button');
    btn.className = 'msg-copy-btn';
    btn.title = 'Copy to clipboard';
    btn.innerHTML = ICON_COPY;
    btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var text = getMessageText(msgDiv);
        if (!text) return;
        copyToClipboard(text);
        btn.innerHTML = ICON_CHECK;
        btn.classList.add('copied');
        setTimeout(function () {
            btn.innerHTML = ICON_COPY;
            btn.classList.remove('copied');
        }, 1500);
    });
    msgDiv.appendChild(btn);
}

var _origAddMessage = addMessage;
addMessage = function (id, type, dataJson) {
    _origAddMessage(id, type, dataJson);
    var el = document.getElementById('msg-' + id);
    if (el) addCopyButton(el);
};

var _origLoadMessages = loadMessages;
loadMessages = function (jsonArray) {
    _origLoadMessages(jsonArray);
    var msgs = _container.querySelectorAll('.msg');
    for (var i = 0; i < msgs.length; i++) {
        if (!msgs[i].querySelector('.msg-copy-btn')) addCopyButton(msgs[i]);
    }
};

var _ctxMenu;
function createCtxMenu() {
    _ctxMenu = document.createElement('div');
    _ctxMenu.className = 'ctx-menu';
    var copyItem = document.createElement('div');
    copyItem.className = 'ctx-menu-item';
    copyItem.textContent = 'Copy';
    copyItem.addEventListener('click', function () {
        var sel = window.getSelection().toString();
        if (sel) copyToClipboard(sel);
        _ctxMenu.style.display = 'none';
    });
    _ctxMenu.appendChild(copyItem);
    document.body.appendChild(_ctxMenu);
}

document.addEventListener('contextmenu', function (e) {
    var sel = window.getSelection().toString();
    if (sel) {
        e.preventDefault();
        if (!_ctxMenu) createCtxMenu();
        _ctxMenu.style.display = 'block';
        _ctxMenu.style.left = Math.min(e.clientX, window.innerWidth - 145) + 'px';
        _ctxMenu.style.top = Math.min(e.clientY, window.innerHeight - 45) + 'px';
    }
});

document.addEventListener('click', function () {
    if (_ctxMenu) _ctxMenu.style.display = 'none';
});

document.addEventListener('DOMContentLoaded', function () {
    _container = document.getElementById('chat-container');
    _container.addEventListener('scroll', function () {
        _userScrolledUp = !isNearBottom();
    });
});
</script>

# ForgePilot is a fork and has no VS Marketplace listing of its own.
# The upstream workflow published to adospace's marketplace account on every
# `v*.*.*` tag; running that here would either fail (no PAT) or, worse, push a
# fork build over someone else's listing. It is replaced by a manual,
# build-only job that just proves the VSIX still packs.
#
# To publish for real, add a marketplace listing and a MARKETPLACE_PAT secret,
# then restore the publish steps from upstream's history:
#   git show upstream/master:.github/workflows/publish-vsix.yml
name: Build VSIX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore src/ForgePilot.slnx

      - name: Build VSIX package
        run: dotnet build src/ForgePilot.slnx -c Release -v minimal

      - name: Locate VSIX artifact
        id: vsix
        shell: pwsh
        run: |
          $vsixPath = Get-ChildItem -Path "src/ForgePilot.VSExtension/bin/Release" -Filter "*.vsix" -Recurse | Select-Object -First 1
          if (-not $vsixPath) {
            Write-Error "VSIX file not found in build output"
            exit 1
          }
          echo "path=$($vsixPath.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Found VSIX: $($vsixPath.Name)"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgePilot-vsix
          path: ${{ steps.vsix.outputs.path }}
